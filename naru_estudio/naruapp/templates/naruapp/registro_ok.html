{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Conexión Tutoría Estudiantil</title>
    <!-- Incluye Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'naruapp/css/style_cuenta.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">
        

    <div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-md text-center">
        
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Proceso Finalizado</h1>
        
        {% if messages %}
        <ul>
        {% for m in messages %}
            <li>{{ m }}</li>
        {% endfor %}
        </ul>
        {% endif %}
        
        <p class="text-lg text-gray-700 mb-6">
            ¡Tu cuenta ha sido creada con éxito!
        </p>

        <a href="#" 
        class="inline-block bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200">
            Ir a Iniciar Sesión
        </a>
    </div>
    
</body>
</html>
