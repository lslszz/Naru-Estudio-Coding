{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión - Conexión Tutoría Estudiantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'naruapp/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'naruapp/img/sapo.png' %}"">
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">

    <div class="w-full max-w-4xl custom-card-style overflow-hidden">
        <div class="grid grid-cols-1 md:grid-cols-2">

            <div class="hidden md:block">
                <img src="{% static 'img/login_image.jpg' %}" 
                     alt="Ilustración de estudiantes y tutores" 
                     class="w-full h-full object-cover custom-image-style">
            </div>

            <div class="p-8 sm:p-10"> 
                
                <header class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold text-[var(--accent)]">
                        ¡Bienvenido a Naru-Estudio!
                    </h1>
                    <p class="mt-2 text-sm text-[var(--muted)]">
                        Ingresa tus credenciales para continuar.
                    </p>
                </header>

                <form action="#" method="POST" class="space-y-6">
                {% csrf_token %}
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" name="email" id="email" required 
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-1 input-focus bg-[var(--input-bg)] sm:text-sm"
                                placeholder="tu.correo@ejemplo.com">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                        <input type="password" name="password" id="password" required 
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-1 input-focus bg-[var(--input-bg)] sm:text-sm"
                                placeholder="Ingresa tu contraseña">
                    </div>

                    <div>
                        <button type="submit" 
                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white 
                                        bg-[var(--accent)] hover:bg-[#1e293b] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--accent)] 
                                        transition duration-150 ease-in-out">
                            Iniciar Sesión
                        </button>
                    </div>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-sm">
                        ¿No tienes una cuenta?
                        <a href="#" class="font-medium text-[var(--yellow)] hover:text-[var(--darker-yellow)]">
                            Regístrate aquí
                        </a>
                    </p>
                </div>
            </div> </div> </div> </body>
</html>
